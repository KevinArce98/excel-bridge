<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="excel-bridge — the lightweight Excel toolkit for TypeScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#334155" fill-opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- Decorative spreadsheet cells, right side -->
  <g opacity="0.9">
    <g transform="translate(792,70)">
      <rect x="0"   y="0"  width="88" height="34" rx="5" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.55"/>
      <rect x="96"  y="0"  width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="192" y="0"  width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="288" y="0"  width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>

      <rect x="0"   y="42" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="96"  y="42" width="88" height="34" rx="5" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.55"/>
      <rect x="192" y="42" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="288" y="42" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>

      <rect x="0"   y="84" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="96"  y="84" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="192" y="84" width="88" height="34" rx="5" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.55"/>
      <rect x="288" y="84" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>

      <rect x="0"   y="126" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="96"  y="126" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="192" y="126" width="88" height="34" rx="5" fill="#1B2336" stroke="#334155"/>
      <rect x="288" y="126" width="88" height="34" rx="5" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.55"/>
    </g>
    <rect x="792" y="70" width="376" height="160" fill="url(#bg)" fill-opacity="0" />
  </g>
  <!-- Fade the cells into the background on the far right -->
  <rect x="980" y="0" width="220" height="300" rx="16" fill="url(#bg)" fill-opacity="0.65"/>

  <!-- Icon mark: spreadsheet -->
  <g transform="translate(80,96)" filter="url(#soft)">
    <rect x="0" y="0" width="108" height="108" rx="18" fill="#1B2336" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="16" width="80" height="20" rx="5" fill="url(#green)"/>
    <rect x="14" y="44" width="36" height="14" rx="3" fill="#334155"/>
    <rect x="58" y="44" width="36" height="14" rx="3" fill="#334155"/>
    <rect x="14" y="66" width="36" height="14" rx="3" fill="#334155"/>
    <rect x="58" y="66" width="36" height="14" rx="3" fill="#22C55E" fill-opacity="0.55"/>
    <rect x="14" y="88" width="36" height="10" rx="3" fill="#273049"/>
    <rect x="58" y="88" width="36" height="10" rx="3" fill="#273049"/>
  </g>

  <!-- Wordmark -->
  <text x="224" y="150" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="60" font-weight="700" letter-spacing="-1">
    <tspan fill="#F8FAFC">excel</tspan><tspan fill="#64748B">-</tspan><tspan fill="#22C55E">bridge</tspan>
  </text>

  <!-- Tagline -->
  <text x="226" y="196" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="23" font-weight="500" fill="#94A3B8">The lightweight Excel toolkit for TypeScript</text>

  <!-- Feature chips -->
  <g font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600">
    <g transform="translate(226,222)">
      <rect x="0" y="0" width="200" height="30" rx="15" fill="#1B2336" stroke="#334155"/>
      <text x="18" y="20" fill="#CBD5E1">read + write .xlsx</text>
    </g>
    <g transform="translate(438,222)">
      <rect x="0" y="0" width="178" height="30" rx="15" fill="#1B2336" stroke="#334155"/>
      <text x="18" y="20" fill="#CBD5E1">zero heavy deps</text>
    </g>
    <g transform="translate(628,222)">
      <rect x="0" y="0" width="152" height="30" rx="15" fill="#1B2336" stroke="#334155"/>
      <text x="18" y="20" fill="#CBD5E1">tree-shakeable</text>
    </g>
  </g>
</svg>
